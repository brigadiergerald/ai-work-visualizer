<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>試験用の架空の読書会：開催案内と運営チェックリスト</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: #233d35;
      background: #f5f8ef;
      line-height: 1.85;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 56px 24px;
      background: linear-gradient(145deg, #edf7ee, #fffaf0);
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
    }

    .label {
      display: inline-block;
      margin: 0 0 16px;
      padding: 5px 16px;
      border: 1px solid #accbb3;
      border-radius: 999px;
      background: #e3f1e4;
      color: #28533b;
      font-size: 0.875rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4.5vw, 2.9rem);
      line-height: 1.5;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin: 12px 0 24px;
      color: #4b6255;
      font-size: 1.05rem;
    }

    .notice {
      margin: 0;
      padding: 18px 22px;
      border: 1px solid #dfca85;
      border-left: 5px solid #ad7a16;
      border-radius: 12px;
      background: #fff6d9;
      color: #60460d;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .sections {
      display: grid;
      grid-template-columns: 0.95fr 1.15fr;
      gap: 24px;
      margin-top: 32px;
      align-items: start;
    }

    section {
      min-width: 0;
      padding: 30px;
      border: 1px solid #d6e3d4;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 8px 28px rgb(45 76 48 / 5%);
    }

    h2 {
      margin: 0 0 24px;
      padding-bottom: 14px;
      border-bottom: 2px solid #dcebd9;
      color: #28533b;
      font-size: 1.35rem;
      line-height: 1.6;
    }

    .details {
      display: grid;
      gap: 14px;
    }

    .detail {
      margin: 0;
      padding: 16px 18px;
      border: 1px solid #e0e9da;
      border-radius: 12px;
      background: #f6faf2;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    ol {
      margin: 0;
      padding-left: 1.65em;
    }

    li {
      padding-left: 0.45em;
      overflow-wrap: anywhere;
    }

    li + li {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e6ece2;
    }

    li::marker {
      color: #37654a;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      body {
        padding: 28px 16px;
      }

      .sections {
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 24px;
      }

      section {
        padding: 24px 20px;
      }

      .notice {
        padding: 16px;
      }
    }

    @media print {
      body {
        padding: 0;
        background: #ffffff;
      }

      main {
        max-width: none;
      }

      .sections {
        grid-template-columns: 1fr;
      }

      section {
        box-shadow: none;
        break-inside: avoid;
      }

      .notice,
      li {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">試験用サンプル</p>
      <h1>試験用の架空の読書会</h1>
      <p class="subtitle">開催案内と運営チェックリスト</p>
      <p class="notice">これは試験用の架空条件であり、現実のイベント情報として扱わないでください。</p>
    </header>

    <div class="sections">
      <section aria-labelledby="announcement-title">
        <h2 id="announcement-title">開催案内</h2>
        <div class="details">
          <p class="detail">日時：2026年11月14日 14:00〜16:00</p>
          <p class="detail">会場：森の図書室</p>
          <p class="detail">参加方法：当日受付</p>
        </div>
      </section>

      <section aria-labelledby="checklist-title">
        <h2 id="checklist-title">運営チェックリスト</h2>
        <ol>
          <li>架空の運営想定として、開催前に会場の座席と受付の案内表示を準備する。</li>
          <li>当日受付では個人情報を収集せず、参加者を会場内へ案内する。</li>
          <li>14:00の開始と16:00の終了に合わせて進行時間を管理する。</li>
          <li>終了後に使用した場所と備品を片づける。</li>
        </ol>
      </section>
    </div>
  </main>
</body>
</html>
