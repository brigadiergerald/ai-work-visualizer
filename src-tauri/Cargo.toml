[package]
name = "ai-guild"
version = "0.1.0"
edition = "2021"

[features]
qa-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
regex = "1"
html5ever = "=0.40.1"
cssparser = "=0.38.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "=0.23.1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Credentials", "Win32_Networking_WinHttp"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
